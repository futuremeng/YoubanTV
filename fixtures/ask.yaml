# 题目前置与出题夹具；键的词汇表见 vocab.yaml，取值域来自 contract/contract.json。

ASK-01:
  spec: [spec/ASK.md#ASK-01]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true }
  cases:
    - name: 包命中时不走 LLM
      given: { packHit: true, llmHit: true, mode: ambient }
      when: { mode: ambient }
      expect: { source: pack, capability: { companionContext: off }, shown: [来源标记] }
    - name: 成员自作的题优先于大纲随机
      given: { packHit: false, memberAuthoredHit: true, mode: ambient }
      when: { mode: ambient }
      expect: { source: member, shown: [来源标记] }
    - name: 未开启出题开关时大纲随机顶替 LLM
      given: { packHit: false, memberAuthoredHit: false, llmHit: true, egress: { aiQuestions: off }, mode: ambient }
      when: { mode: ambient }
      expect: { source: outlineRandom, egress: { aiQuestions: off } }
    - name: 开关开启时 LLM 题带来源标记
      given: { packHit: false, memberAuthoredHit: false, llmHit: true, egress: { aiQuestions: on }, mode: ambient }
      when: { mode: ambient }
      expect: { source: llm, shown: [来源标记] }

ASK-02:
  spec: [spec/ASK.md#ASK-02]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true, kpState: shaky, prereqState: mastered }
  cases:
    - name: 状态与依赖同时决定出题强度
      when: { mode: ambient }
      expect: { value: { candidateLevel: 3, effectiveGroups: 4 }, shown: [依赖状态] }
    - name: 状态 unknown 时不判弱点
      given: { kpState: unseen, prereqState: mastered }
      when: { mode: ambient }
      expect: { value: { candidateLevel: 1, effectiveGroups: 2 }, kpState: unseen }

ASK-03:
  spec: [spec/ASK.md#ASK-03]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true }
  cases:
    - name: 默认出题走固定模板
      given: { mode: ambient, kpState: shaky, prereqState: mastered }
      when: { mode: ambient }
      expect: { value: { dynamicGeneration: 0, stemIdentical: true, optionsLines: 3, singleKey: true, estimatedSeconds: 60 }, shown: [选题理由] }

ASK-04:
  spec: [spec/ASK.md#ASK-04, spec/AUTONOMY.md#AUTO-05]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true, kpState: shaky, prereqState: mastered, mode: ambient }
  cases:
    - name: 答错只入掌握账与补一补池
      when: { answers: [wrong], confirmation: correct }
      expect: { events: [ANSWER], kpState: weak, delta: { backlogSize: 1 }, stars: credited, absent: [扣分机制] }
    - name: 答对按掌握度入账
      when: { answers: [correct], confirmation: correct }
      expect: { events: [ANSWER], kpState: mastered, delta: { backlogSize: 0 } }
    - name: 错两次优先重问一次
      given: { kpState: weak, wrongAnswers: 2 }
      when: { mode: ambient }
      expect: { value: { priorityReask: 1 }, kpState: weak }

ASK-05:
  spec: [spec/ASK.md#ASK-05]
  given: { profile: "member:kid", watchedMs: 1200000, moveFromMs: 3600000, inSlot: true }
  cases:
    - name: 满组即止并写事件
      given: { answeredInTask: 5, roundTarget: 5 }
      when: { answers: [correct] }
      expect: { events: [ROUND_DONE], value: { taskEnded: true, roundsDone: 1 }, noEvents: [ANSWER] }
    - name: 满组后仍可自愿继续
      given: { answeredInTask: 5, roundTarget: 5, taskDone: false }
      when: { answers: [correct] }
      expect: { events: [ANSWER], value: { roundsDone: 1 } }

ASK-06:
  spec: [spec/ASK.md#ASK-06]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true }
  cases:
    - name: 计划内已答过的题不再问
      given: { answeredInTask: 1, kpState: shaky, sameKp: true }
      when: { mode: ambient }
      expect: { allowed: false, value: { recomputed: false }, noEvents: [ANSWER] }
    - name: 补一补不受当日限制
      given: { kpState: weak, backlogSize: 1 }
      when: { mode: ambient }
      expect: { allowed: true, events: [ANSWER] }

ASK-07:
  spec: [spec/ASK.md#ASK-07, spec/LAYER.md#LAYER-12]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true, dueAt: "20:00", mode: ambient }
  cases:
    - name: 按到期问，不看进度百分比
      when: { stillWatching: true }
      expect: { value: { questionPickedAt: dueAt }, due: { kind: quiz, mode: ambient, window: present } }
    - name: 时段外不提问
      given: { inSlot: false }
      when: { stillWatching: true }
      expect: { allowed: false, noEvents: [ANSWER], due: null }
    - name: 呈现写 due_shown
      when: { questionShown: true }
      expect: { events: [due_shown], answerable: 这道题是什么时候问的 }
    - name: 补看也照问
      given: { dayType: schoolday, carryOver: 1 }
      when: { stillWatching: true }
      expect: { allowed: true, events: [due_shown], noEvents: [ACHIEVED] }

ASK-08:
  spec: [spec/ASK.md#ASK-08]
  given: { profile: "member:kid", inSlot: true, mode: ambient, kpState: shaky, prereqState: mastered, egress: { companionContext: off } }
  cases:
    - name: 上下文只含片名与时间戳
      given: { outlineScope: { subjects: [chinese] } }
      when: { mode: ambient }
      expect: { capability: { companionContext: off }, value: { extraSources: 0 } }
    - name: 补一补的出题只用大纲
      given: { kpId: outline-3, kpState: weak, backlogSize: 1 }
      when: { mode: ambient }
      expect: { sameSource: [core/topics], value: { dynamicGeneration: 0 } }
    - name: LLM 生成失败退回固定题面不重试
      given: { egress: { aiQuestions: on }, llmHit: true }
      when: { verify: failed }
      expect: { events: [llm_generate_failed], value: { retried: false, stemIdentical: true, fallbackApplied: true } }

ASK-09:
  spec: [spec/ASK.md#ASK-09]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true, mode: ambient, kpState: shaky, prereqState: mastered }
  cases:
    - name: 题干不超过 80 字
      when: { mode: ambient }
      expect: { value: { stemChars: 78 }, shown: [选题理由] }
    - name: 选项不超过三行且唯一键
      when: { mode: ambient }
      expect: { value: { optionsLines: 3, singleKey: true, estimatedSeconds: 60 } }

ASK-10:
  spec: [spec/ASK.md#ASK-10]
  cases:
    - name: 三种题类各 20 次判对率均 ≥95%
      given: { questionClass: prediction, estimateAccuracy: 95, attempts: 20 }
      when: { exerciseVerdict: counted }
      expect: { value: { sensorModeAllowed: true, signalSource: sensor }, noEvents: [ANSWER] }
    - name: 任一类低于阈值用手动确认顶替
      given: { questionClass: observation, estimateAccuracy: 80, attempts: 20 }
      when: { exerciseVerdict: ambiguous }
      expect: { value: { manualConfirmation: true }, noEvents: [ANSWER], shown: [手动确认入口] }
    - name: 样本不足 20 次不启用传感器
      given: { questionClass: judgement, estimateAccuracy: 99, attempts: 12 }
      when: { exerciseVerdict: counted }
      expect: { value: { manualConfirmation: true }, noEvents: [ANSWER] }
    - name: 传感器误判不扣分
      given: { kpState: shaky, wrongAnswers: 1, signalSource: sensor }
      when: { exerciseVerdict: rejected }
      expect: { kpState: shaky, unchanged: [stars, backlogSize] }

PACK-01:
  spec: [spec/PACK.md#PACK-01]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true, mode: ambient }
  cases:
    - name: 包命中优先，不依赖联网
      given: { packHit: true }
      when: { mode: ambient }
      expect: { source: pack, capability: { offline: granted }, allowed: true }

PACK-02:
  spec: [spec/PACK.md#PACK-02]
  given: { profile: "member:kid", inSlot: true, mode: ambient }
  cases:
    - name: 自题可标状态，不可设审批门
      given: { member: "member:kid", memberAuthoredHit: true }
      when: { get: "GET /api/topics" }
      expect: { value: { approvalRequired: false, fieldsPerItem: [id, kpId, kp, owner, status, evidence, addedAt] }, absent: [先批完才入账] }
    - name: 自题来源标注到人
      given: { member: "member:mom", memberAuthoredHit: true }
      when: { mode: ambient }
      expect: { shown: [来源标记], value: { eventProfile: "member:kid" } }

PACK-03:
  spec: [spec/PACK.md#PACK-03, spec/COMMIT.md#COMMIT-01]
  given: { profile: "member:kid", inSlot: true, mode: ambient, stemChars: 78, optionsLines: 3, singleKey: true, estimatedSeconds: 60 }
  cases:
    - name: 自题走同一校验
      given: { member: "member:mom", memberAuthoredHit: true }
      when: { mode: ambient }
      expect: { authoring: passed, shown: [校验状态] }
    - name: 不合规题面退回
      given: { member: "member:mom", stemChars: 200, optionsLines: 5, singleKey: false, estimatedSeconds: 60 }
      when: { mode: ambient }
      expect: { authoring: rejected, value: { fallbackApplied: true }, notShown: [成就页] }
    - name: 自题命中写事件
      when: { memberAuthoredHit: true }
      expect: { events: [ANSWER], value: { eventProfile: "member:mom" } }

PACK-04:
  spec: [spec/PACK.md#PACK-04]
  given: { profile: "member:kid", watchedMs: 2400000, inSlot: true, kpState: weak, prereqState: mastered }
  cases:
    - name: 补一补池超 20 题走选题器
      given: { backlogSize: 24 }
      when: { mode: ambient }
      expect: { value: { poolSize: 20, evicted: oldest }, sameSource: [core/day] }
