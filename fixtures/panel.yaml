# 页面清单只有一处（spec/PANEL.md）。这两条问的都是「扫描那一处答出来的数」，与 PROFILE-01 的
# branchInForbiddenSites 同一个写法——写成 value: {...} 读的是方案里不存在的键，抓到东西也不会红。
PANEL-01:
  spec: [PANEL-01]
  cases:
    - name: 文档与契约里引用的页名都在那张表里
      given: { profile: 'member:kid' }
      expect: { pageRefsUnresolved: 0 }
    - name: 那张表不新增功能，只是同一本账的视图
      given: { profile: 'member:kid' }
      expect: { value: { panelPages: 12, pageAnswersStated: true } } # 「伴看」那一页划出范围之后是 12 页（AUTO-17、D79）

PANEL-02:
  spec: [PANEL-02]
  cases:
    - name: 首启那句「要改去」的页名出自那张表
      given: { profile: 'member:kid' }
      expect: { wherePagesResolve: true }

    - name: 那 12 页还没做界面时，每一句「要改去」都带上这一句（D80）
      given: { profile: 'member:kid' }
      expect: { value: { panelAvailable: false, panelUnavailableStated: true } }
