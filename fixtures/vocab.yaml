# 夹具断言词汇表（单一来源）。FORMAT 见 FORMAT.md，机器校验见 tools/check-fixtures.sh。
# 规则：given / when 的键必须出现在 fields 里；expect 的键必须出现在 predicates 里；
#       凡 type 指向契约枚举的，取值必须存在于 contract/contract.json 的对应枚举。

structure:
  entry: {required: [spec, cases], optional: [given]}
  case: {required: [name, when, expect], optional: [given]}
  bannedKeys: [then, when2, when3, expect2, expect3, expectAlso, thenExpect]

types:
  ms: 毫秒整数
  number: 整数或小数
  boolean: 布尔
  string: 字符串
  symbol: 见 symbols
  profile: "member:<id> | none"
  kv: 任意键值映射（键必须是本表内已声明的名字）

symbols:
  # 界面与位置
  surface: [self, panel, devicePage, guidePage, studyPage, panelPage]
  wording: [statusSentence, nextStep, none]
  notify: [none, once]
  effective: [now, nextDay, nextPlanVersion, never]
  report: [none, ownWeekly]
  gate: [required, passed]
  # 状态与来源
  evidence: [events, capability, roles]
  dimension: [audience, assembly, strength, profile]
  egressState: [on, off]
  probeState: [granted, denied, unknown]
  # 开关现值是另一套取值：不是探针结论，是用户/持有者拨到位没有。
  switchState: [on, off]
  authoring: [passed, rejected]
  source: [pack, member, llm, outlineRandom]
  stars: [credited, recalculated, unchanged]
  mastery: [updated, unchanged]
  verify: [passed, failed]
  answer: [correct, wrong]
  confirmation: [correct, wrong]
  signalSource: [manual, sensor]
  exerciseVerdict: [counted, ambiguous, rejected]
  presentIn: [core, device, contract, code]

fields:
  # —— 约定怎么立
  plans: {type: kv, note: "按身份各立一组约定：{member:kid: {version, signed, ...}}"}
  firstRun: {type: boolean}
  switchTo: {type: profile}
  agreementStep: {type: number}
  # —— 身份与主体
  profile: {type: profile}
  member: {type: profile}
  actor: {type: "member:<id> | role:ruleEditor | role:keyHolder | system"}
  target: {type: "member:<id> | self"}
  activeMember: {type: profile}
  acceptedBy: {type: profile}
  audience: {type: enum, enum: audience}
  audiences: {type: list, enum: audience}
  dueKinds: {type: list, enum: dueKind} # 这一档的约定项有哪几类（PROFILE-11、D76）
  watchedPerDevice: {type: kv} # 各设备各说各的数：这台的数在 watchedMs，另一台的数单列（DAY-10、D77）
  linkKinds: {type: list} # 手机与电视之间的直连有哪几件事（SENSE-06、D77）
  linkCarries: {type: list} # 那条直连上过界的是什么：只有计数与判定
  frameLeavesDevice: {type: boolean} # 画面出不出手机——永远是否（SENSE-01、SENSE-02）
  # —— 「这段时间的账」那一页（REPORT-01..04）：三条开关都读契约 report 那一处，模型不自己决定。
  reportPush: {type: boolean} # 有没有定时推送——永远没有（REPORT-01）
  reportComparison: {type: boolean} # 有没有区间对比——永远没有（REPORT-02）
  reportVisibleTo: {type: list} # 这一页给谁看：只有本人（REPORT-03）
  reportForbiddenWords: {type: number} # 那批不许有的词在这一页的产出里出现几次（REPORT-04）
  reportNeverSingleSource: {type: boolean} # 不许有的词是不是只有一份清单（D45）
  reportWindowDays: {type: number} # 那一页默认看几天
  reportRows: {type: number} # 那一页有几行——零行就是这页在空转（REPORT-02）
  strength: {type: enum, enum: strength}
  strengths: {type: list, enum: strength}
  assembly: {type: symbol, values: [tv, mobile]}
  presentation: {type: enum, enum: presentation}
  roles: {type: kv, note: "role → member:<id>"}
  rolesField: {type: symbol, values: [present, absent]}

  # —— 当日账与约定
  dayType: {type: symbol, values: [schoolday, weekend]}
  watchedMs: {type: ms}
  allowanceMs: {type: ms}
  graceMs: {type: ms}
  moveFromMs: {type: ms}
  pauseMs: {type: ms}
  overMs: {type: ms}
  roundsDone: {type: number}
  roundTarget: {type: number}
  inSlot: {type: boolean}
  slots: {type: symbol, values: [onlyWithinSlots, quizWithinSlots]}
  planVersion: {type: number}
  signed: {type: boolean}
  stillWatching: {type: boolean}
  exerciseTasks: {type: list}
  series: {type: list, note: "一段节律：[{at, periodMs, amplitude}]，计次那一条读它（SENSE-01、F13）"}
  taskDone: {type: boolean}
  quizDone: {type: boolean}
  exerciseDone: {type: boolean}

  # —— 自管字段四项（与 contract.selfManagedFields.values 同名）
  groupsPerTask: {type: number}
  questionsPerGroup: {type: number}
  questionsPerTaskCap: {type: number}
  clearBacklogFirst: {type: boolean}

  # —— 题目与选题
  answeredInTask: {type: number}
  answers: {type: list, values: [correct, wrong]}
  confirmation: {type: symbol, values: [correct, wrong]}
  selfGrade: {type: symbol, values: [pass, fail]}
  wrongCount: {type: number}
  wrongAnswers: {type: number}
  abandoned: {type: boolean}
  kp: {type: string}
  kpId: {type: string}
  estimateAccuracy: {type: number}
  attempts: {type: number}
  dayType: {type: symbol, values: [schoolday, weekend]}
  backlogSize: {type: number}
  stars: {type: number}
  movedToday: {type: boolean}
  carryOver: {type: number}
  kpState: {type: enum, enum: knowledgeState}
  prereqState: {type: enum, enum: knowledgeState}
  stemChars: {type: number}
  optionsLines: {type: number}
  singleKey: {type: boolean}
  estimatedSeconds: {type: number}
  questionClass: {type: symbol, values: [prediction, observation, judgement]}
  supports: {type: enum, enum: mode}
  modeRequested: {type: enum, enum: mode}
  packHit: {type: boolean}
  memberAuthoredHit: {type: boolean}
  llmHit: {type: boolean}
  llmGenerated: {type: boolean}
  verify: {type: symbol, values: [passed, failed]}
  saved: {type: symbol, values: [draft]}
  outlineScope: {type: kv}
  candidateLevel: {type: number}
  dueAt: {type: string}

  # —— 能力与设备
  capability: {type: kv, note: "capability id → probeState | on | off | number"}
  pauseProbe: {type: kv, note: "{responseRate: 0..1, sampleCount: n} 或 unknown"}
  paired: {type: boolean}
  rebooted: {type: boolean}
  probedAt: {type: symbol, values: [beforeLastReboot, afterLastReboot]}
  monotonicDeltaMs: {type: ms}
  wallClockDeltaMs: {type: ms}
  egress: {type: kv, note: "出网开关名 → on | off"}
  aiQuestions: {type: symbol, values: [on, off]}
  aiGrading: {type: symbol, values: [on, off]}
  companionContext: {type: symbol, values: [off, titleOnly]}

  # —— 动议、角色、清单
  motion: {type: kv, note: "{kind: motionKind, target, minutes, accepted}"}
  kind: {type: enum, enum: motionKind}
  accepted: {type: boolean}
  declined: {type: boolean}
  unansweredFor: {type: symbol, values: [ttl]}
  retryAfterMs: {type: ms}
  roleChange: {type: kv, note: "{role, from, to, action: grant | revoke}"}
  reauth: {type: boolean}
  item: {type: string, note: "清单条目 id，形如 <assembly>.<category>.<item>"}
  checklistStatus: {type: enum, enum: checklistStatus}
  pendingItems: {type: number}
  owner: {type: "member:<id> | role:ruleEditor | role:keyHolder | system"}

  # —— 运动与传感器
  signalSource: {type: symbol, values: [manual, sensor]}
  exerciseVerdict: {type: symbol, values: [counted, ambiguous, rejected]}

  # —— 其它状态与动作
  mode: {type: enum, enum: mode}
  status: {type: enum, enum: status}
  plan: {type: kv, note: "{version, signed}"}
  deadlinePassed: {type: boolean}
  questionShown: {type: boolean}
  updateAvailable: {type: boolean}
  crossedMidnight: {type: boolean}
  manualConfirmation: {type: boolean}
  sameKp: {type: boolean}
  minutesPerRound: {type: number}
  minutesPerGroup: {type: number}
  quiet: {type: symbol, values: [allDay]}
  srsProgress: {type: number}
  pendingReview: {type: number}
  goal: {type: symbol, values: [reduceOthersWatching, lowerGrace]}
  l5: {type: kv, note: "{by: signedSlotRule | motion, paired}"}
  sessions: {type: list, note: "[{device, fromMs, toMs}]"}
  scopes: {type: list, values: [read, rules, content, grade, diagnostics, egress]}
  via: {type: symbol, values: [panel, device]}
  simulate: {type: boolean}
  dayToken: {type: string, note: "当日 token；重启不产生新的"}
  presence: {type: enum, enum: presence}
  inviteTier: {type: enum, enum: inviteTier}
  tier: {type: enum, enum: tier}
  offline: {type: boolean}
  invitationsToday: {type: number}
  inviteDeclined: {type: boolean}
  projectSafety: {type: symbol, values: [present, missing]}
  sessionMs: {type: ms}
  calibration: {type: kv, note: "{attempts, falseCountRate}"}
  rhythm: {type: kv, note: "{kind, periodMs, amplitude}"}
  tierRevert: {type: kv, note: "{to: tier}"}
  secondSession: {type: boolean}

  # —— 外部动作与调用
  put: {type: string, note: "PUT /api/…"}
  get: {type: string, note: "GET /api/…"}
  writeAttempt: {type: kv, note: "{path, profile}"}
  switch: {type: kv, note: "{from, to}"}
  planChange: {type: kv}
  revision: {type: kv, note: "{by, verdict, reason}"}
  export: {type: symbol, values: [mine]}
  memberAdded: {type: profile}
  deviceAdded: {type: symbol, values: [tv, mobile]}
  profileDeleted: {type: profile}
  contentBindingChanged: {type: boolean}
  at: {type: string}

predicates:
  # —— 约定怎么立（spec/AGREE.md）。这几条目前模型没实现，执行器会记成「未支持」，不许默默通过。
  planForProfile: {type: kv} # 切到这个身份之后生效的那一组约定
  agreementStep: {type: number} # 首启六步走到第几步
  defaultsWhere: {type: string} # 按默认那一步去哪儿改（契约 agreement.firstRun.where，AGREE-05）
  whereStated: {type: boolean} # 这一屏有没有把「去哪儿改」写在屏上：要选的步骤不问这个
  defaultsOnly: {type: boolean} # 这一屏的条目是否全部来自默认值（还没签）
  signaturePending: {type: boolean} # 是不是停在「待对方签署」
  otherProfileUnchanged: {type: boolean} # 另一组的约定有没有被这一份的收紧改掉
  status: {enum: status}
  checklistStatus: {enum: checklistStatus}
  due: {oneOf: [null, kv]}
  mode: {enum: mode}
  nextAction: {enum: nextAction}
  tier: {enum: tier}
  tierCeiling: {enum: tier}
  surface: {listOf: surface}
  wording: {values: [statusSentence, nextStep, none]}
  events: {listOf: event}
  noEvents: {listOf: event}
  absent: {listOf: name, note: "契约字段 / 端点 / API / 事件：不存在"}
  presentIn: {listOf: name, note: "出现在代码或契约中的位置"}
  # 代码里按受众的分支位点扫出来的条数（PROFILE-01）：以前写成 value: {...}，读的是方案里不存在的键，
  # 扫描抓到也不红——顶层断言键才是真在看这一处（F33）。
  branchInForbiddenSites: {type: number}
  allowedBranchSites: {type: list}
  # —— 页面清单那一处扫出来的数（PANEL-01、PANEL-02）：页名只由契约那张表答。
  pageRefsUnresolved: {type: number} # 文档与契约里查不到的页名有几处
  panelPages: {type: number} # 那张表里有几页
  pageAnswersStated: {type: boolean} # 每一页都写明了它回答哪个问题
  wherePagesResolve: {type: boolean} # 首启那句「要改去」的页名出自那张表
  # —— 计次那一条数出来的是什么（SENSE-01、F31）：三个数都由模型答，执行器不自己数。
  countedReps: {type: number}
  ambiguousReps: {type: number}
  rejectedReps: {type: number}
  value: {map: metric}
  delta: {map: metric}
  unchanged: {listOf: metric}
  identicalAcross: {map: dimensionFields}
  sameSource: {listOf: codePath}
  stateFields: {values: [agree], note: "内核产出的字段集合与契约 commitState.fields 是同一组"}
  shown: {listOf: name}
  notShown: {listOf: name}
  visibleOn: {listOf: surface}
  effective: {values: [now, nextDay, nextPlanVersion, never]}
  applied: {type: boolean}
  accepted: {type: boolean}
  allowed: {type: boolean}
  writable: {type: boolean}
  blocked: {type: boolean}
  egress: {map: egressState}
  capability: {map: capability}
  checklist: {map: checklistShape}
  roles: {map: roleHolder}
  plan: {map: planShape}
  kpState: {enum: knowledgeState}
  stars: {values: [credited, recalculated, unchanged]}
  mastery: {values: [updated, unchanged]}
  gradedBy: {enum: gradedBy}
  source: {values: [pack, member, llm, outlineRandom]}
  authoring: {values: [passed, rejected]}
  cooldown: {map: dayCount}
  pool: {map: poolShape}
  notify: {values: [none, once]}
  escalate: {type: boolean}
  evidenceFrom: {listOf: evidence}
  gate: {values: [required, passed]}
  inReport: {values: [none, ownWeekly]}
  answerable: {type: string, note: "这条断言回答的那个问题"}

kvKeys: [from, to, by, role, action, kind, target, minutes, accepted, verdict, reason, path,
  profile, device, tv, mobile, watchedPerDevice, linkKinds, linkCarries, frameLeavesDevice,
  reportPush, reportComparison, reportVisibleTo, reportForbiddenWords, reportRows,
  reportNeverSingleSource, reportWindowDays, subjects, levels, mode, deficit, window, size, evicted, days, version, signed,
  added, notAdded, status, owner, ownerForms, dimension, fields, paired, trigger, responseRate,
  sampleCount, fieldsPerItem, fields, slots, tighten, moveFrom, audience,
  attempts, falseCountRate, periodMs, amplitude, capability,
  # 清单与登记表新用上的嵌套键（D41：接口先登记，再用）。
  ids, reopened, registryTier, checklistStatusFrom]

# 度量名：出现在 value / delta / unchanged 里的字段
metricNames: [watchedMs, allowanceMs, graceMs, moveFromMs, pauseMs, overMs, roundsDone,
  answeredInTask, statusFrom, frameRetentionMs, diskWrites, probeSampleCount, falseCountMax,
  recalculatedToday, taskEnded, tierValues, tierSourceFields, perDevice, fallbackRules,
  itemSources, guideIsFirstFiveItems, otherItemsUnaffected, starsDelta, masteryDelta,
  clicks, revertPath, endpointRead, rowsPerProfile,
  candidateLevel, effectiveGroups, questionsPerTaskCap, groupsPerTask, questionsPerGroup,
  clearBacklogFirst, backlogSize, carryOver, stars, kp, kpId, kpState, remainingMs, dayOffsetMs,
  dayRolled, dayTokenKept, replayed, recomputed, inTighteningComparison, prereqWalk, priorityReask,
  stemChars, stemIdentical, optionsLines, singleKey, estimatedSeconds, questionPickedAt,
  dynamicGeneration, fallbackApplied, source, gradeMethod, verify, verifySemanticsUnchanged,
  sensorModeAllowed, manualConfirmation, signalSource, counting, exerciseVerdict,
  ceilingApplied, poolSame, poolSize, evicted, httpStatus, endpoint, writeEndpoint, apiExists, writePathExists,
  commitStateTier,
  newEndpointNeeded, allowed, writable, allowedBranchSites, branchInForbiddenSites,
  pageRefsUnresolved, panelPages, pageAnswersStated, wherePagesResolve,
  selfManagedFields, selfManagedMayLowerGrace, acknowledgementOnlyItems, humanAction,
  profileDomain, activeMemberProfile, eventProfile, eventSequenceOrder, inheritedWatchedMs,
  watchedRecorded, sessionsReconstructable, whereAccepted, motionRequired, playerPaused,
  resumedAfterAnswer, retried, runningVersion, versionInEveryEvent, uiComputesVerdict,
  uiComputesVerdictText, quizIssued, exerciseInvite, coWatchInvite, remoteInstall, installedBy,
  cooldownMs, crossDeviceSignalling, endpointsSameSemantics, schemaUnchanged, featuresVisible,
  rolesDerivableFromToken, anyAudienceMayHold, approvalRequired, identityNeutralBranches,
  extraSources, bodyFontSp, fontStepUp, contrastRaised, tierValues, tierSourceFields,
  tierCeilingLifted, clicks, revertPath, probeScheduled, probeOnMainThread, inAppFallback,
  accessibilitySurface, bootReceiver, sceneRows, counterInputFields, frameRetentionMs, diskWrites,
  probeSampleCount, falseCountMax, usedAsHealthDiagnosis, projectValid, sessionCapMs, dailyCapMs,
  dailyInviteCap, promptCount, inviteIntervalMinMs, inviteIntervalMaxMs, presence, inviteTier, appSwitchRestoreMs, sameL15DelayMs,
  dayTypeAwareness, tierL4, l5Invoked, l5Allowed, egressHost, maxQuestions, inWeeklyReport,
starsDelta, masteryDelta, perDevice, otherItemsUnaffected, statusFrom, guideIsFirstFiveItems,
rowsPerProfile, taskEnded, resumedFrom, ruleId, srsProgress, pendingReview, minutesPerGroup, recalculatedToday, fallbackRules, storedFields, derived, itemSources, agreementRetainedDays, logRetentionDays, telemetry]

apiNames: [LockTask, DeviceAdmin, performGlobalAction, FLAG_SECURE, fullScreenIntent,
  mediaSessionHijack, ACCESS_FINE_LOCATION, CameraX]

# 概念级否定：这些机制在产品里不存在，用 absent 引用
conceptNames: [先批完才入账, 扣分机制, 阻断观看, 红点递进催促, 时长兑换, 按身份的功能开关,
  成就系统, 连击, 徽章, 签到, 排行, 称号, 代为受理, 第二本账, 仅写日志, 录制通路, 拍照通路]

# 能力登记表的能力 id（docs/facts/DEVICES.md §3）
capabilityIds: [paired, cameraChannel, pause, overlay, notifications, bootReceiver,
  companionContext, mediaSession, voice, autoLaunchAtBoot, homeAssistant, motionSensor,
  proximitySensor, screenOn, screenOff, ambientLight, volume, speakerOutput, screenCapture,
  systemPresentation, timeSource, remoteInput, offline]

# 出网开关名（contract.enums.egressSwitch + 外部端点开关）
egressNames: [aiQuestions, aiGrade, diagnostics, companionContext, homeAssistant]
