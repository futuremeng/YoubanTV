# 约定引擎与自主性夹具；键的词汇表见 vocab.yaml，取值域来自 contract/contract.json。

COMMIT-01:
  spec: [spec/COMMIT.md#COMMIT-01]
  cases:
    - name: 免题段内不出题，角标显示剩余
      given: { profile: "member:kid", graceMs: 1800000, watchedMs: 1200000 }
      when: { inSlot: true }
      expect: { status: honored, due: null, value: { remainingMs: 600000 }, shown: [角标剩余], surface: [self], tier: L1 }
    - name: 免题段边界即时转到期（形态取当天默认档）
      given: { profile: "member:kid", graceMs: 1800000, watchedMs: 1800000 }
      when: { inSlot: true }
      expect: { status: due, due: { kind: quiz, mode: focused, deficit: questions, window: present }, tier: L2 }

COMMIT-02:
  spec: [spec/COMMIT.md#COMMIT-02, spec/LAYER.md#LAYER-07]
  given: { profile: "member:kid", graceMs: 1800000, moveFromMs: 3600000, strength: negotiated, watchedMs: 2400000 }
  cases:
    - name: 做题约定到期，ambient 走角落浮层
      when: { mode: ambient }
      expect:
        status: due
        due: { kind: quiz, mode: ambient, deficit: questions, window: present }
        nextAction: quiz
        mode: ambient
        tier: L1.5
        value: { ruleId: present }
    - name: focused 先请求暂停，答完恢复
      when: { mode: focused, capability: { pause: granted } }
      expect: { status: due, mode: focused, tier: L2, nextAction: quiz, value: { playerPaused: true, resumedAfterAnswer: true } }
    - name: 暂停未响应自动转 ambient 并说明当前模式
      when: { mode: focused, capability: { pause: denied } }
      expect: { mode: ambient, tier: L1.5, shown: [当前模式与原因], value: { retried: false } }

COMMIT-03:
  spec: [spec/COMMIT.md#COMMIT-03]
  given: { profile: "member:kid", allowanceMs: 3600000, moveFromMs: 2400000, watchedMs: 3000000 }
  cases:
    - name: 运动约定到期，ambient 由传感器端计次
      when: { mode: ambient, signalSource: sensor }
      expect: { status: due, due: { kind: exercise, mode: ambient, deficit: reps }, nextAction: exercise, tier: L1.5 }
    - name: 手动确认走同一端点，由本人确认
      given: { actor: "member:kid" }
      when: { mode: focused, signalSource: manual }
      expect: { value: { endpoint: "/api/exercise" }, delta: { roundsDone: 1 }, absent: [grantMinutes] }
    - name: 他人代本人确认计次不生效
      given: { actor: "member:mom", roundsDone: 0 }
      when: { mode: focused, signalSource: manual }
      expect: { allowed: false, applied: false, noEvents: [ROUND_DONE] }
    - name: 满一组只入账
      given: { roundTarget: 3, roundsDone: 3 }
      when: { exerciseDone: true }
      expect: { status: honored, events: [ROUND_DONE], absent: [grantMinutes, unlocked, unspentMs] }

COMMIT-04:
  spec: [spec/COMMIT.md#COMMIT-04, docs/PRODUCT.md#§3]
  given: { profile: "member:kid", allowanceMs: 3600000 }
  cases:
    - name: 超时只记 overdue，不阻断观看
      given: { watchedMs: 3720000 }
      when: { stillWatching: true }
      expect:
        status: overdue
        events: [OVER]
        tier: L1.5
        wording: statusSentence
        value: { overMs: 120000 }
        absent: [LockTask, fullScreenIntent]
        blocked: false
    - name: 恰好等于约定线即 overdue（边界归 COMMIT-04 的 ≥），零量不写 OVER
      given: { watchedMs: 3600000 }
      when: { stillWatching: true }
      expect: { status: overdue, tier: L1.5, noEvents: [OVER], value: { overMs: 0 } }
    - name: 超时后加时动议受理，约定线后移
      given: { watchedMs: 3720000 }
      when: { motion: { kind: extend, target: "member:kid", minutes: 15, accepted: true } }
      expect:
        status: due
        accepted: true
        effective: now
        value: { dayOffsetMs: 900000 }
        events: [MOTION, MOTION_SETTLED, PLAN_CHANGE]
        absent: [grantMinutes]

COMMIT-05:
  spec: [spec/COMMIT.md#COMMIT-05]
  cases:
    - name: 约定全部满足即 honored，只入账星与掌握
      given: { quizDone: true, exerciseDone: true }
      when: { taskDone: true }
      expect:
        status: honored
        events: [DONE, ROUND_DONE]
        stars: credited
        mastery: updated
        absent: [grantMinutes, unlocked, unspentMs, doneMs]

COMMIT-06:
  spec: [spec/COMMIT.md#COMMIT-06, docs/COMMITMENTS.md#§3]
  given: { strength: selfManaged }
  cases:
    - name: 未达成的后果只有四类
      when: { deadlinePassed: true }
      expect:
        events: [MISSED]
        delta: { backlogSize: 1 }
        inReport: ownWeekly
        shown: [overdue 状态条]
        notify: none
        absent: [扣分机制, 阻断观看]
    - name: 新增后果必须先写进 COMMITMENTS §3
      when: { planChange: { kind: consequence } }
      expect: { gate: required, effective: nextPlanVersion }

COMMIT-07:
  spec: [spec/COMMIT.md#COMMIT-07, spec/AUTONOMY.md#AUTO-16]
  cases:
    - name: 受理后冻结倒数，暂停段单列
      given: { actor: "member:mom", target: "member:dad" }
      when: { motion: { kind: pause, target: "member:dad", accepted: true }, pauseMs: 600000 }
      expect:
        accepted: true
        applied: true
        tier: L1.5
        value: { pauseMs: 600000, resumedFrom: frozenValue }
        unchanged: [watchedMs]
        notify: once
    - name: 对自己的会话可即时暂停
      given: { actor: "member:kid", target: self }
      when: { motion: { kind: pause, target: self, accepted: true } }
      expect: { applied: true, value: { motionRequired: false }, delta: { pauseMs: 1 } }
    - name: 对他人未经受理不生效
      given: { actor: "member:kid", target: "member:mom" }
      when: { motion: { kind: pause, target: "member:mom", accepted: false } }
      expect: { applied: false, accepted: false, events: [MOTION_UNANSWERED], visibleOn: [self, panel] }

COMMIT-08:
  spec: [spec/COMMIT.md#COMMIT-08, spec/AUTONOMY.md#AUTO-04]
  cases:
    - name: 未签署的计划不生效
      given: { plan: { version: 7, signed: false }, actor: "member:mom" }
      when: { planChange: { version: 7 } }
      expect: { effective: never, value: { runningVersion: 6 }, noEvents: [PLAN_SIGNED] }
    - name: 双方签署后生效并写事件
      given: { plan: { version: 7, signed: true }, actor: "member:kid" }
      when: { planChange: { version: 7 } }
      expect: { effective: now, events: [PLAN_SIGNED], value: { versionInEveryEvent: true } }
    - name: 规则字段变动另写 PLAN_CHANGE
      given: { actor: "member:mom" }
      when: { planChange: { allowanceMs: { from: 3600000, to: 5400000 } } }
      expect: { events: [PLAN_CHANGE], effective: now }

COMMIT-09:
  spec: [spec/COMMIT.md#COMMIT-09]
  cases:
    - name: 每个 due 四件套齐全，缺一即红
      given: { profile: "member:kid", watchedMs: 2400000, graceMs: 1800000, moveFromMs: 3600000 }
      when: { mode: ambient }
      expect: { due: { kind: quiz, mode: ambient, deficit: questions, window: present }, sameSource: [core/commit], value: { uiComputesVerdict: false } }
    - name: 每次呈现写 due_shown
      given: { profile: "member:kid", watchedMs: 2400000, graceMs: 1800000, moveFromMs: 3600000 }
      when: { questionShown: true }
      expect: { events: [due_shown], answerable: 这道题是什么时候问的 }

COMMIT-10:
  spec: [spec/COMMIT.md#COMMIT-10, spec/AUTONOMY.md#AUTO-16]
  cases:
    - name: 控制面只有呈现，阻断类 API 不出现
      when: { capability: { overlay: granted } }
      expect:
        absent: [LockTask, DeviceAdmin, performGlobalAction, FLAG_SECURE, fullScreenIntent, mediaSessionHijack, L4]
        sameSource: [device/enforcement]
        blocked: false
    - name: 已签署时段规则且已配对才允许 L5
      given: { paired: true }
      when: { l5: { by: signedSlotRule, paired: true } }
      expect: { allowed: true, blocked: false }
    - name: 动议或未配对时不能启动 L5
      given: { paired: false }
      when: { l5: { by: motion, paired: false } }
      expect: { allowed: false, absent: ["POST /api/l5"] }

COMMIT-11:
  spec: [spec/COMMIT.md#COMMIT-11, spec/PROFILE.md#PROFILE-04]
  given: { profile: none }
  cases:
    - name: 未选身份只落账不判定
      given: { watchedMs: 1800000 }
      when: { stillWatching: true }
      expect:
        status: honored
        due: null
        tier: L1.5
        shown: [选择身份的提示]
        noEvents: [ANSWER, ROUND_DONE]
        value: { eventProfile: none, quizIssued: false, exerciseInvite: false, coWatchInvite: false }
    - name: 选定身份后按该身份起算，不结转空转段
      given: { watchedMs: 1800000 }
      when: { switch: { from: none, to: "member:kid" } }
      expect: { events: [PROFILE_SWITCH], value: { eventProfile: "member:kid", inheritedWatchedMs: 0 } }

AUTO-15:
  spec: [spec/AUTONOMY.md#AUTO-15]
  cases:
    - name: 主观题自评先入账，不依赖他人参与
      given: { actor: "member:kid", egress: { aiGrade: "off" } }
      when: { selfGrade: pass }
      expect: { stars: credited, mastery: updated, gradedBy: self, absent: [先批完才入账] }
    - name: 改判只改账目判定，不改 status 算法
      given: { actor: "member:kid", selfGrade: pass }
      when: { revision: { by: "member:mom", verdict: fail, reason: 步骤缺第二步 } }
      expect:
        events: [REVISION]
        stars: recalculated
        unchanged: [status]
        visibleOn: [self, panel]
    - name: 「先批完才入账」这类开关不存在
      when: { capability: { aiGrade: "off" } }
      expect: { absent: [先批完才入账] }
    - name: 设备更新由激活身份触发，他人只能查阅与回退
      given: { actor: "member:mom", updateAvailable: true }
      when: { revision: { by: "member:mom", verdict: none, reason: 查阅更新说明 } }
      expect: { allowed: false, value: { remoteInstall: false, installedBy: activeMember }, events: [REMOTE] }

AUTO-16:
  spec: [spec/AUTONOMY.md#AUTO-16, spec/AUTONOMY.md#AUTO-03]
  cases:
    - name: 未受理的动议不生效
      given: { actor: "member:kid", target: "member:dad" }
      when: { motion: { kind: pause, target: "member:dad", accepted: false }, unansweredFor: ttl }
      expect: { applied: false, events: [MOTION, MOTION_UNANSWERED], visibleOn: [self, panel] }
    - name: 受理才生效，生效后只走 L1.5 状态句
      given: { actor: "member:kid", target: "member:dad" }
      when: { motion: { kind: pause, target: "member:dad", accepted: true } }
      expect: { applied: true, tier: L1.5, notify: none, wording: statusSentence, delta: { pauseMs: 1 } }
    - name: 单方面控制他人的 API 不存在
      when: { capability: { overlay: granted } }
      expect: { absent: [LockTask, DeviceAdmin, performGlobalAction], sameSource: [device/enforcement] }
    - name: 婉拒后同类动议冷却 30 分钟
      given: { actor: "member:kid", target: "member:dad" }
      when: { motion: { kind: extend, target: "member:dad", minutes: 15, accepted: false }, retryAfterMs: 1799999 }
      expect: { accepted: false, applied: false, value: { cooldownMs: 1800000 } }
    - name: 动议不能命令外部设备断电
      given: { paired: true }
      when: { motion: { kind: slotChange, target: "member:kid", accepted: true }, l5: { by: motion, paired: true } }
      expect: { allowed: false, applied: true, absent: ["POST /api/l5"] }
