# 约定怎么立（spec/AGREE.md）。这里刻意留下模型还没实现的部分：执行器会把它们记成「未支持」，
# 不会当通过（D41）。它们就是 M3.5 那张活清单，绿的那天这条约定才算真的落地。
AGREE-01:
  spec: [AGREE-01]
  given: {profile: "member:kid"}
  cases:
    - name: 装机后第一次打开，什么约定都没有，按默认跑
      when: {}
      expect: {status: honored, defaultsOnly: true, nextAction: agreement, tier: L1}
    - name: 六步走到第三步也能用，只是条目还是默认的
      given: {agreementStep: 3}
      when: {}
      expect: {status: honored, defaultsOnly: true, nextAction: agreement}
    # 有一条到期项要做时，下一步仍是那件事——「没签」只加一栏常驻说明，不抢下一步、不抬档位（AGREE-04）。
    - name: 已经有一条到期项要做，缺约定不抢下一步
      given: {profile: "member:kid", graceMs: 1800000, moveFromMs: 3600000, watchedMs: 2400000}
      when: {}
      expect: {status: due, nextAction: quiz, tier: L2}

AGREE-04:
  spec: [AGREE-04]
  given: {profile: "member:kid"}
  cases:
    - name: 学龄·上学日按契约默认
      given: {audience: child}
      when: {}
      expect: {defaultsOnly: true}
    - name: 成年·上学日按契约默认，形态是 ambient
      given: {audience: "grown-up"}
      when: {}
      expect: {mode: ambient, defaultsOnly: true}

AGREE-06:
  spec: [AGREE-06]
  given: {profile: "member:kid", watchedMs: 600000}
  cases:
    - name: 改了约定没签 → 旧版本继续生效，且不算谁的违规
      given: {plan: {version: 7, signed: false, allowanceMs: 3600000, graceMs: 1800000}}
      when: {planChange: {version: 7}}
      expect: {status: honored, signaturePending: true, effective: never}

AGREE-05:
  spec: [AGREE-05, DAY-08, PROFILE-01]
  given: { profile: "member:kid" }
  cases:
    - name: 时段那一步按默认，屏上写明去哪儿改
      given: { agreementStep: 4 }
      expect: { whereStated: true, defaultsOnly: true, nextAction: agreement }
    - name: 要选的那一步不问「去哪儿改」：它给的是现值
      given: { agreementStep: 3 }
      expect: { whereStated: false }

AGREE-08:
  spec: [AGREE-08]
  given: {profile: "member:kid", watchedMs: 600000}
  cases:
    - name: 切到成年身份，加载的是那一组的生效版本
      given: {plans: {"member:kid": {version: 3, signed: true, allowanceMs: 3600000},
                      "member:dad": {version: 9, signed: true, allowanceMs: 7200000}}}
      when: {switchTo: "member:dad"}
      expect: {status: honored, otherProfileUnchanged: true, value: {runningVersion: 9}}
    # 收紧本身的生效路径已在 COMMIT-04 / PROFILE / SENSE 那几处断言过，这里不重复写第二遍（D45）；
    # 这一条只回答一件事：改自己这一组，会不会串到别人那一组。
    - name: 这一份改过了，切到另一身份看到的还是那一组
      given: {plan: {version: 3, signed: true, allowanceMs: 3600000, graceMs: 1800000}}
      when: {planChange: {version: 4, allowanceMs: 1800000}, switchTo: "member:dad"}
      expect: {otherProfileUnchanged: true}

AGREE-09:
  spec: [AGREE-09]
  given: {profile: "member:kid"}
  cases:
    - name: 切到还没有约定的身份 → 下一步又是立约定，按默认跑
      given: {plans: {"member:kid": {version: 3, signed: true, allowanceMs: 3600000}}}
      when: {switchTo: "member:mom"}
      expect: {defaultsOnly: true, nextAction: agreement}
    # kid 签过不等于切到 dad 之后也有一份签过的约定——按身份算（AGREE-08）。
    - name: 另一档签过了不算这一档签过
      given: {plans: {"member:kid": {version: 3, signed: true, allowanceMs: 3600000},
                      "member:dad": {version: 1, signed: false, allowanceMs: 7200000}}}
      when: {switchTo: "member:dad"}
      expect: {nextAction: agreement}
    - name: 那一档本来就签过 → 切过去不用再立
      given: {plans: {"member:kid": {version: 3, signed: true, allowanceMs: 3600000},
                      "member:dad": {version: 1, signed: true, allowanceMs: 7200000}}}
      when: {switchTo: "member:dad"}
      expect: {status: honored, defaultsOnly: false}
