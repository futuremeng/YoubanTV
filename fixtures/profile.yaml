# 身份与角色夹具（M1.1 的一部分）；取值域以 contract/contract.json 为准。

AUTO-14:
  spec: [spec/AUTONOMY.md#AUTO-14, spec/PROFILE.md#PROFILE-01]
  fields: [groupsPerTask, questionsPerGroup, questionsPerTaskCap, clearBacklogFirst]
  cases:
    - name: 三档强度下都只能由本人写入
      given: { strength: [accompanied, negotiated, selfManaged], actor: "member:kid" }
      when: { put: /api/myPlan, groupsPerTask: 4 }
      expect:
        accepted: true
        event: PLAN_CHANGE
        effectiveImmediately: true
        inTighteningComparison: false
    - name: 面板与其它成员没有写入口
      given: { actor: panel, scope: [read, rules, content, grade, diagnostics] }
      when: { put: /api/myPlan, groupsPerTask: 2 }
      expect:
        httpStatus: 403
        writePathExists: false
        readOnlyView: true            # 只显示当前值与改动记录
    - name: 与 audience 无关
      given: { audience: [child, grown-up, senior] }
      expect: { sameWritePath: true, sameQuota: true, branchOnAudience: false }
    - name: 事后可回答「当时按哪组参数出的题」
      when: { askIssuedAfterChange: true }
      expect: { planVersionTraceable: true, planChangeCount: 1 }

PROFILE-10:
  spec: [spec/PROFILE.md#PROFILE-10, spec/AUTONOMY.md#AUTO-09]
  cases:
    - name: 跨身份写入路径不存在
      given: { activeMember: "member:kid" }
      when: { anyWriteEndpoint: { profile: "member:dad" } }
      expect: { rejected: true, profileDomain: ["member:kid", "none"] }
    - name: 一次一个人：并发第二个主体被串行化为事件顺序
      when: { concurrentActor: secondLocalSession }
      expect: { allowed: false, ordering: eventSequence }
    - name: 动议只能由被请求方本人受理
      when: { motion: { kind: extend, target: "member:dad" }, acceptedBy: "member:kid" }
      expect: { rejected: true, accepted: false, appliedTo: none }
    - name: 角色交接是本机当前激活模式内的两次确认
      when:
        roleChange: { role: ruleEditor, from: "member:mom", to: "member:dad" }
        proposedFrom: activeMode
        acceptedIn: targetOwnMode
      expect:
        events: [MOTION, MOTION_SETTLED, ROLE_CHANGE]
        crossDeviceSignalling: none
        newEndpointNeeded: false
    - name: 收回他人手里的编辑权属收紧，自下一份签署生效
      when: { roleChange: { action: revoke }, signed: false }
      expect: { effectiveNow: false, nextPlanVersion: true, visibleOn: [self, panel] }
    - name: 监护人凭据的移交需本机当场确认
      when: { roleChange: { role: keyHolder }, acceptedRemotely: true }
      expect: { rejected: true, requiresLocalConfirm: true }

PROFILE-01:
  spec: [spec/PROFILE.md#PROFILE-01, contract/contract.json#profile]
  cases:
    - name: Profile 字段集与契约一致
      expect:
        fields: [id, label, audience, content.packs, content.outlineScope, content.exerciseTasks, defaults.mode, defaults.schedulePrefs, defaults.presentation]
        permissionFields: absent
        featureToggleFields: absent
        ceilingFields: absent
    - name: roles 住在成员身上，不由 audience 推导
      given: { audience: child }
      expect: { rolesDerivable: false, anyAudienceMayHold: [ruleEditor, keyHolder] }

PROFILE-02:
  spec: [spec/PROFILE.md#PROFILE-02]
  cases:
    - name: audience 分支只出现在两处
      expect:
        allowedBranchSites: [内容绑定解析, 默认值挑选]
        forbiddenBranchModules: [commit, day, enforcement, task, srs, grade, net]
        branchInForbiddenSites: 0
    - name: 换一个 audience 不改变判定
      given: { samePlan: true, audiences: [child, grown-up, senior] }
      expect: { statusIdentical: true, dueIdentical: true, tierIdentical: true }

PROFILE-03:
  spec: [spec/PROFILE.md#PROFILE-03]
  cases:
    - name: 无额度硬顶、无年龄闸门、无按身份的功能开关
      expect: { forbiddenFields: [allowanceCeiling, ageLimit, selfManageRequiresAge, featureToggleByAudience] }
    - name: 切换强度不改变任何功能可见性，也不需要批准
      when: { strengthChanged: [accompanied, negotiated, selfManaged] }
      expect: { featuresVisible: same, approvalRequired: false, rolesUnchanged: true }

PROFILE-04:
  spec: [spec/PROFILE.md#PROFILE-04]
  cases:
    - name: 跨设备同一身份当日时长为事件并集，重叠去重
      given: { profile: "member:kid", tv: { from: 0, to: 1200 }, mobile: { from: 900, to: 1500 } }
      expect: { watchedMs: 1500, deviceFieldRequired: true }
    - name: 跨身份不互扣时间也不互设上限
      when: { otherProfileOverMs: 3000 }
      expect: { ownStatusChanged: false, ceilingApplied: absent }

PROFILE-05:
  spec: [spec/PROFILE.md#PROFILE-05]
  cases:
    - name: 切换留痕、当前身份常驻可见
      when: { switch: { from: "member:kid", to: "member:grandpa" } }
      expect: { events: [PROFILE_SWITCH], badgeShowsCurrent: true, blocked: false }
    - name: 想约束别人走时段 / 协议 / 动议，不走能力上限
      when: { intent: reduceOthersWatching }
      expect: { allowedPaths: [slotRule, familyAgreement, acceptedMotion], capabilityCeilingPath: absent }

PROFILE-06:
  spec: [spec/PROFILE.md#PROFILE-06]
  cases:
    - name: 内容按身份绑定，schema 不分身份
      expect: { questionSchemaVersions: [v3], branchInSchema: false }
    - name: 新增 audience 不改题意与 verify
      when: { newAudience: exam-sprint }
      expect: { verifySemanticsUnchanged: true, schemaUnchanged: true }

PROFILE-07:
  spec: [spec/PROFILE.md#PROFILE-07, spec/SENSE.md#SENSE-05]
  cases:
    - name: 运动是通用机制，项目按档取
      given: { audience: senior, item: 平衡练习 }
      expect: { safetyFieldsRequired: true, missingSafetyField: invalidItem }
    - name: 约定可以只含做题不含运动段
      when: { exerciseTasks: [] }
      expect: { statusReachable: honored, exerciseDue: never }

PROFILE-08:
  spec: [spec/PROFILE.md#PROFILE-08, spec/AUTONOMY.md#AUTO-10]
  cases:
    - name: 主体一律 member:<id>，契约里不保留 parent
      expect: { principals: [member], retiredPrincipals: [parent], endpointsSameSemantics: [/api/me, /api/myPlan, /api/me/purge, /api/motions] }
    - name: 删除身份转归档，不静默删数据
      when: { profileDeleted: "member:old" }
      expect: { contentAndAgreement: archived, ledgerHistoryKept: true, statedInPanel: true }

PROFILE-09:
  spec: [spec/PROFILE.md#PROFILE-09]
  given: { presentation: large }
  cases:
    - name: 令牌只改字号档 / 对比度 / 键位收敛
      expect: { fontStepUp: 1, contrastRaised: true, remoteKeys: 4, rulesUnchanged: true, wordingSetUnchanged: true }
    - name: 仍满足字号门禁
      expect: { bodyFontSp: 20, gate: 电视正文 ≥20f }
